<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep dark crimson/slate into energy gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Muscle / Gold Energy Gradient -->
    <linearGradient id="muscleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- Dumbbell Silver Gradient -->
    <linearGradient id="ironGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Rounded Background Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="114" fill="none" stroke="rgba(245, 158, 11, 0.3)" stroke-width="3"/>

  <!-- Energy Aura Glow behind Arm -->
  <circle cx="256" cy="256" r="190" fill="url(#glowGrad)"/>

  <!-- Powerful Flexing Biceps Muscle Silhouette (SVG Path) -->
  <g filter="url(#shadow)">
    <!-- Biceps Arm silhouette -->
    <!-- Represents shoulder/deltoid (left), peaked bicep (top center), forearm flexing inward, clenched fist -->
    <path fill="url(#muscleGrad)" d="
      M 160 380
      C 145 340 135 295 145 255
      C 155 220 185 195 210 205
      C 220 170 250 145 290 145
      C 335 145 365 175 375 220
      C 395 210 415 215 425 235
      C 435 255 430 280 415 300
      C 400 320 385 330 375 340
      L 340 310
      C 330 295 315 285 295 290
      C 275 295 255 315 245 340
      C 230 380 205 395 160 380
      Z
    " opacity="0.15"/>

    <!-- Dynamic Modern Flexing Muscle & Barbell Icon -->
    <!-- Heavy Weight Plates on the diagonal -->
    <g transform="rotate(-30 256 256)">
      <!-- Barbell Bar -->
      <rect x="80" y="244" width="352" height="24" rx="12" fill="#94a3b8"/>
      <!-- Inner collar -->
      <rect x="135" y="226" width="16" height="60" rx="6" fill="#cbd5e1"/>
      <rect x="361" y="226" width="16" height="60" rx="6" fill="#cbd5e1"/>
      <!-- Plates Left -->
      <rect x="110" y="200" width="22" height="112" rx="8" fill="url(#ironGrad)"/>
      <rect x="85" y="215" width="22" height="82" rx="6" fill="url(#ironGrad)"/>
      <!-- Plates Right -->
      <rect x="380" y="200" width="22" height="112" rx="8" fill="url(#ironGrad)"/>
      <rect x="405" y="215" width="22" height="82" rx="6" fill="url(#ironGrad)"/>
    </g>

    <!-- Super Impressive Flexing Biceps Silhouette (Center Highlight) -->
    <!-- Vectorized Arm Muscle Contour -->
    <path fill="url(#muscleGrad)" stroke="#78350f" stroke-width="4" stroke-linejoin="round" d="
      M 165 375
      C 150 330 148 290 162 250
      C 172 220 198 200 226 212
      C 238 180 268 152 308 154
      C 345 156 376 186 382 225
      C 402 216 422 222 432 242
      C 440 258 438 278 424 294
      C 410 310 392 322 376 332
      C 360 342 344 335 334 320
      C 324 305 306 296 288 300
      C 268 304 250 324 240 346
      C 225 380 195 392 165 375
      Z
    "/>

    <!-- Muscle Definition Lines (Bicep peak, Tricep, Forearm veins/curves) -->
    <path d="M 235 220 C 260 190 295 190 315 225" fill="none" stroke="#b45309" stroke-width="6" stroke-linecap="round"/>
    <path d="M 280 235 C 310 240 335 270 340 300" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
    <path d="M 365 245 C 385 250 395 270 390 285" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>

    <!-- Sweat / Energy Sparkles -->
    <polygon points="360,110 366,128 384,134 366,140 360,158 354,140 336,134 354,128" fill="#fde047"/>
    <polygon points="170,160 174,174 188,178 174,182 170,196 166,182 152,178 166,174" fill="#fbbf24"/>
  </g>

  <!-- Bold Badge Text at Bottom -->
  <rect x="156" y="420" width="200" height="42" rx="21" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="256" y="448" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#fde047" letter-spacing="3">GYM LOG</text>
</svg>
